<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R8T · Repricer con IA — Real Trends</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="description" content="R8T: armá tu estrategia de repricing para Mercado Libre con bloques, condiciones e IA, y simulá el resultado en vivo. Una función de Real Trends.">
  <meta name="theme-color" content="#0065F3">
  <!-- Tarjeta al compartir el link (Open Graph / Twitter) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Real Trends">
  <meta property="og:title" content="R8T · Repricer con IA — Real Trends">
  <meta property="og:description" content="Armá tu estrategia de precios para Mercado Libre con bloques, condiciones e IA. Simulá el resultado en vivo. Como n8n, pero para tus precios.">
  <meta property="og:image" content="https://r8-t.vercel.app/assets/og.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://r8-t.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="R8T · Repricer con IA — Real Trends">
  <meta name="twitter:description" content="Armá tu estrategia de precios para Mercado Libre con bloques, condiciones e IA. Simulá el resultado en vivo.">
  <meta name="twitter:image" content="https://r8-t.vercel.app/assets/og.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles/theme.css?v=14">
  <link rel="stylesheet" href="styles/app.css?v=14">
  <link rel="stylesheet" href="styles/editor.css?v=14">
</head>
<body>
<div class="app">

  <!-- Rail -->
  <nav class="rail">
    <div class="rail__logo" title="Real Trends"><img src="assets/logo-realtrends.svg" alt="Real Trends"></div>
    <button class="rail__item" title="Inicio" data-ic="home"></button>
    <button class="rail__item is-active" title="R8T · Estrategias" data-ic="grid"></button>
    <button class="rail__item" title="Análisis" data-ic="chart"></button>
    <button class="rail__item" title="Precios" data-ic="precio"></button>
    <button class="rail__item" title="Reglas guardadas" data-ic="book"></button>
    <div class="rail__spacer"></div>
    <button class="rail__item" title="Ayuda" data-ic="info"></button>
    <div class="rail__avatar" title="Mi cuenta">TR</div>
  </nav>

  <div class="main">
    <!-- Topbar -->
    <header class="topbar">
      <span class="topbar__logo"><img src="assets/logo-realtrends.svg" alt="Real Trends"></span>
      <span class="topbar__badge">R8T</span>
      <div class="topbar__sep"></div>
      <input class="strat-name" id="stratName" value="Mi estrategia" spellcheck="false">
      <div class="save-state" id="saveState"><span class="dot"></span><span id="saveText">Guardado</span></div>
      <div class="topbar__spacer"></div>
      <div class="topbar__actions">
        <button class="btn btn--ghost btn--sm" id="btnNew" data-ic="plus">Nueva</button>
        <button class="btn btn--ghost btn--sm" id="btnExport" data-ic="download">Exportar</button>
        <button class="btn btn--soft btn--sm" id="btnSave" data-ic="save">Guardar</button>
        <button class="btn btn--primary btn--sm" id="btnActivate" data-ic="play">Activar</button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">

      <!-- Paleta -->
      <aside class="palette">
        <div class="palette__head">
          <div class="palette__title">Bloques</div>
          <div class="search" data-ic="search"><input id="paletteSearch" placeholder="Buscar bloque…" spellcheck="false"></div>
        </div>
        <div class="palette__hint">Arrastralos al flujo, o tocá <b>“Agregar bloque”</b> en el lienzo.</div>
        <div class="palette__list" id="paletteList"></div>
        <div class="palette__foot">
          <button class="btn btn--soft" id="btnCustom" style="width:100%;justify-content:center" data-ic="plus">Crear bloque propio</button>
        </div>
      </aside>

      <!-- Editor -->
      <section class="editor-col">
        <div class="explain">
          <div class="explain__icon" data-ic="book"></div>
          <div class="explain__body">
            <div class="explain__title">Qué hace esta estrategia</div>
            <div class="explain__steps" id="explainSteps"></div>
          </div>
        </div>
        <div class="canvas-wrap">
          <div class="canvas" id="canvas">
            <div class="world" id="world">
              <div class="flow" id="flow"></div>
            </div>
          </div>
          <div class="canvas-controls">
            <div class="zoom-label" id="zoomLabel">100%</div>
            <div class="grp">
              <button id="zoomIn" title="Acercar" data-ic="plus"></button>
              <button id="zoomOut" title="Alejar" data-ic="minus"></button>
            </div>
            <div class="grp"><button id="fitView" title="Centrar / encuadrar" data-ic="fit"></button></div>
            <div class="grp">
              <button id="undoBtn" title="Deshacer (Ctrl+Z)" data-ic="undo"></button>
              <button id="redoBtn" title="Rehacer (Ctrl+Y)" data-ic="redo"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- Panel derecho -->
      <aside class="side">
        <div class="side__tabs">
          <button class="side__tab is-active" data-tab="result">Resultado</button>
          <button class="side__tab" data-tab="presets">Estrategias</button>
          <button class="side__tab" data-tab="chat">Asistente</button>
        </div>
        <div class="side__body">
          <div class="side__pane is-active" id="pane-result"></div>
          <div class="side__pane" id="pane-presets"></div>
          <div class="side__pane" id="pane-chat"></div>
        </div>
      </aside>

    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/icons.js?v=16"></script>
<script src="js/blocks.js?v=16"></script>
<script src="js/strategies.js?v=16"></script>
<script src="js/editor.js?v=14"></script>
<script src="js/simulate.js?v=14"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
