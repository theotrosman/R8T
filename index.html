<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R8T · Editor de estrategias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/editor.css">
</head>
<body>
<div class="app">

  <!-- ================= Rail de íconos (nav Real Trends) ================= -->
  <nav class="rail">
    <div class="rail__logo" title="Real Trends">rt</div>
    <button class="rail__item" title="Inicio" data-ic="home"></button>
    <button class="rail__item is-active" title="R8T · Estrategias" data-ic="grid"></button>
    <button class="rail__item" title="Análisis" data-ic="chart"></button>
    <button class="rail__item" title="Precios" data-ic="precio"></button>
    <button class="rail__item" title="Reglas guardadas" data-ic="book"></button>
    <div class="rail__spacer"></div>
    <button class="rail__item" title="Ayuda" data-ic="info"></button>
    <div class="rail__avatar" title="Mi cuenta">TR</div>
  </nav>

  <div class="main">
    <!-- ================= Topbar ================= -->
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__badge">R8T</span>
        <span class="chip chip--teal" data-ic-chip="bolt">Repricer con IA</span>
      </div>
      <div class="topbar__sep"></div>
      <input class="strat-name" id="stratName" value="Mi estrategia" spellcheck="false">
      <div class="save-state" id="saveState"><span class="dot"></span><span id="saveText">Guardado</span></div>

      <div class="topbar__spacer"></div>

      <div class="xp" title="Nivel de la estrategia">
        <div class="xp__ring" id="xpRing" style="--xp:40%"><span class="xp__lvl" id="xpLvl">1</span></div>
        <div class="xp__txt"><b id="xpTitle">Aprendiz</b><br><span class="muted" id="xpHealth">Salud 40%</span></div>
      </div>

      <div class="topbar__actions">
        <button class="btn btn--ghost btn--sm" id="btnNew" data-ic="plus">Nueva</button>
        <button class="btn btn--ghost btn--sm" id="btnExport" data-ic="download">Exportar</button>
        <button class="btn btn--soft btn--sm" id="btnSave" data-ic="save">Guardar</button>
        <button class="btn btn--primary btn--sm" id="btnActivate" data-ic="play">Activar estrategia</button>
      </div>
    </header>

    <!-- ================= Workspace ================= -->
    <div class="workspace" id="workspace">

      <!-- Paleta de bloques -->
      <aside class="palette">
        <div class="palette__head">
          <div class="palette__title">Bloques</div>
          <div class="search" data-ic="search"><input id="paletteSearch" placeholder="Buscar bloque…" spellcheck="false"></div>
        </div>
        <div class="palette__list" id="paletteList"></div>
        <div class="palette__foot">
          <button class="btn btn--soft" id="btnCustom" style="width:100%;justify-content:center" data-ic="plus">Crear bloque propio</button>
        </div>
      </aside>

      <!-- Canvas -->
      <section class="canvas-wrap">
        <div class="canvas" id="canvas">
          <div class="world" id="world">
            <svg class="edges" id="edges" width="100%" height="100%"></svg>
          </div>
        </div>

        <div class="canvas-hint" id="canvasHint">
          <div class="canvas-hint__card">
            <div data-ic="drag" style="display:flex;justify-content:center"></div>
            <div><b>Arrastrá bloques</b> desde la izquierda</div>
            <div style="font-size:12px;margin-top:4px">o cargá una estrategia lista desde el panel derecho</div>
          </div>
        </div>

        <div class="canvas-controls">
          <div class="zoom-label" id="zoomLabel">100%</div>
          <div class="grp">
            <button id="zoomIn" title="Acercar" data-ic="plus"></button>
            <button id="zoomOut" title="Alejar" data-ic="minus"></button>
          </div>
          <div class="grp">
            <button id="fitView" title="Encajar" data-ic="fit"></button>
          </div>
        </div>

        <!-- Barra de simulación -->
        <div class="simbar" id="simbar">
          <div class="simbar__head">
            <span data-ic="play" style="display:flex"></span>
            <b>Simulador de precio</b>
            <button class="simbar__toggle" id="simToggle" title="Contraer" data-ic="chevron"></button>
          </div>
          <div class="simbar__body">
            <div class="sim-product">
              <span>Producto:</span>
              <select id="simProduct"></select>
            </div>
            <div class="sim-price">
              <span class="big" id="simPrice">$0</span>
              <span class="cmp" id="simCmp"></span>
            </div>
            <div class="sim-grid">
              <div class="sim-stat"><div class="l">Margen neto</div><div class="v" id="simMargin">—</div></div>
              <div class="sim-stat"><div class="l">Ganancia / u</div><div class="v" id="simProfit">—</div></div>
            </div>
            <div class="sim-health">
              <div class="sim-health__bar"><div class="sim-health__fill" id="simHealthFill"></div></div>
              <div class="sim-health__row"><span class="muted">Salud de la estrategia</span><b id="simHealthTxt">—</b></div>
            </div>
            <div class="sim-notes" id="simNotes"></div>
          </div>
        </div>
      </section>

      <!-- Panel derecho -->
      <aside class="side">
        <div class="side__tabs">
          <button class="side__tab is-active" data-tab="inspector">Configuración</button>
          <button class="side__tab" data-tab="presets">Estrategias</button>
          <button class="side__tab" data-tab="chat">Asistente IA</button>
        </div>
        <div class="side__body">
          <div class="side__pane is-active" id="pane-inspector"></div>
          <div class="side__pane" id="pane-presets"></div>
          <div class="side__pane" id="pane-chat"></div>
        </div>
      </aside>

    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/icons.js"></script>
<script src="js/blocks.js"></script>
<script src="js/strategies.js"></script>
<script src="js/editor.js"></script>
<script src="js/simulate.js"></script>
<script src="js/inspector.js"></script>
<script src="js/app.js"></script>
</body>
</html>
