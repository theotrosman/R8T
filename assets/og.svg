<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Mulish, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0065F3"/><stop offset="1" stop-color="#3f86ff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71D8BF"/><stop offset="1" stop-color="#45c6a6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#171E43" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#teal)"/>

  <!-- marca -->
  <g transform="translate(80,86)">
    <rect width="52" height="52" rx="14" fill="url(#teal)"/>
    <text x="26" y="35" text-anchor="middle" font-size="22" font-weight="900" fill="#08312a" letter-spacing="-1">rt</text>
    <text x="70" y="24" font-size="20" font-weight="800" fill="#585757">real</text>
    <text x="70" y="47" font-size="20" font-weight="900" fill="#292828">trends</text>
  </g>

  <!-- titular -->
  <text x="80" y="300" font-size="132" font-weight="900" fill="url(#blue)" letter-spacing="-4">R8T</text>
  <text x="80" y="368" font-size="46" font-weight="900" fill="#292828" letter-spacing="-1">Repricer con IA para Mercado Libre</text>
  <text x="82" y="420" font-size="27" font-weight="600" fill="#585757">Armá tu estrategia de precios con bloques, condiciones e IA.</text>
  <text x="82" y="456" font-size="27" font-weight="600" fill="#585757">Simulá el resultado en vivo. Como n8n, pero para tus precios.</text>

  <!-- chips -->
  <g transform="translate(82,505)" font-size="21" font-weight="800">
    <g><rect width="220" height="46" rx="23" fill="#EDF3FC"/><text x="110" y="30" text-anchor="middle" fill="#0065F3">Bloques arrastrables</text></g>
    <g transform="translate(240,0)"><rect width="150" height="46" rx="23" fill="#e9faf5"/><text x="75" y="30" text-anchor="middle" fill="#45c6a6">Asistente IA</text></g>
    <g transform="translate(410,0)"><rect width="210" height="46" rx="23" fill="#f4fbd6"/><text x="105" y="30" text-anchor="middle" fill="#5b7a00">Simulador en vivo</text></g>
  </g>

  <!-- ilustración: bloques apilados -->
  <g transform="translate(830,150)" filter="url(#sh)">
    <g>
      <rect width="290" height="66" rx="14" fill="#fff" stroke="#e6e9f0"/>
      <rect width="6" height="66" rx="3" fill="#0065F3"/>
      <rect x="24" y="21" width="30" height="24" rx="7" fill="#0065F3"/>
      <rect x="68" y="24" width="150" height="9" rx="4.5" fill="#292828"/>
      <rect x="68" y="41" width="90" height="8" rx="4" fill="#b7bcc7"/>
    </g>
    <rect x="143" y="66" width="3" height="20" fill="#b7bcc7"/>
    <g transform="translate(0,86)">
      <rect width="290" height="66" rx="14" fill="#fff" stroke="#e6e9f0"/>
      <rect width="6" height="66" rx="3" fill="#ef4444"/>
      <rect x="24" y="21" width="30" height="24" rx="7" fill="#ef4444"/>
      <rect x="68" y="24" width="120" height="9" rx="4.5" fill="#292828"/>
      <rect x="68" y="41" width="140" height="8" rx="4" fill="#b7bcc7"/>
    </g>
    <rect x="143" y="152" width="3" height="20" fill="#b7bcc7"/>
    <g transform="translate(0,172)">
      <rect width="290" height="66" rx="14" fill="#fff" stroke="#e6e9f0"/>
      <rect width="6" height="66" rx="3" fill="#16a34a"/>
      <rect x="24" y="21" width="30" height="24" rx="7" fill="#16a34a"/>
      <rect x="68" y="24" width="140" height="9" rx="4.5" fill="#292828"/>
      <rect x="68" y="41" width="80" height="8" rx="4" fill="#b7bcc7"/>
    </g>
    <rect x="143" y="238" width="3" height="20" fill="#b7bcc7"/>
    <g transform="translate(0,258)">
      <rect width="290" height="66" rx="14" fill="#171E43"/>
      <rect x="24" y="21" width="30" height="24" rx="7" fill="#71D8BF"/>
      <rect x="68" y="22" width="120" height="10" rx="5" fill="#fff"/>
      <rect x="68" y="42" width="70" height="8" rx="4" fill="#71D8BF"/>
    </g>
  </g>
</svg>
