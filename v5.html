<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Competencia · Grupos — Real Trends</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Seguí publicaciones de tu competencia, armá grupos y fijate dónde quedaría tu publicación. Una función de Real Trends.">
  <meta name="theme-color" content="#0065F3">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Real Trends">
  <meta property="og:title" content="Competencia · Grupos — Real Trends">
  <meta property="og:description" content="Seguí publicaciones, armá grupos y mirá dónde quedaría tu publicación antes de publicarla.">
  <meta property="og:image" content="https://r8-t.vercel.app/assets/og.svg">
  <meta property="og:url" content="https://r8-t.vercel.app/v5.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles/theme.css?v=14">
  <link rel="stylesheet" href="styles/app.css?v=14">
  <link rel="stylesheet" href="styles/v5.css?v=3">
</head>
<body>
<div class="app app--v5">

  <nav class="rail">
    <div class="rail__logo" title="Real Trends"><img src="assets/logo-realtrends.svg" alt="Real Trends"></div>
    <button class="rail__item" title="Inicio" data-ic="home"></button>
    <button class="rail__item is-active" title="Competencia" data-ic="competencia"></button>
    <button class="rail__item" title="Mercado" data-ic="chart"></button>
    <button class="rail__item" title="Rentabilidad" data-ic="coins"></button>
    <div class="rail__spacer"></div>
    <button class="rail__item" title="Ayuda" data-ic="info"></button>
    <div class="rail__avatar" title="Mi cuenta">TR</div>
  </nav>

  <div class="main">
    <header class="topbar">
      <span class="topbar__logo"><img src="assets/logo-realtrends.svg" alt="Real Trends"></span>
      <span class="topbar__badge">v5</span>
      <div class="topbar__sep"></div>
      <span class="topbar__title">Competencia</span>
      <div class="topbar__spacer"></div>
      <div class="topbar__actions">
        <button class="btn btn--ghost btn--sm" id="btnReset" data-ic="refresh"><span>Empezar de cero</span></button>
      </div>
    </header>

    <div class="v5" id="scroller">
      <div class="v5__inner">

        <h1 class="v5-title">Tus grupos de competencia</h1>

        <div class="v5-tabs" id="tabs"></div>

        <div class="v5-grid">
          <!-- Izquierda: seguir publicaciones -->
          <section class="v5-card">
            <div class="v5-card__h">
              <h2><span class="v5-n">1</span> Seguí publicaciones</h2>
              <span class="v5-count" id="count">0 / 10</span>
            </div>
            <label class="v5-search"><span data-ic="search"></span><input id="q" placeholder="Buscar en Mercado Libre…" spellcheck="false"></label>
            <ul class="v5-list" id="results"></ul>
          </section>

          <!-- Derecha: comparar -->
          <section class="v5-card">
            <div class="v5-card__h">
              <h2><span class="v5-n">2</span> Fijate dónde quedarías</h2>
            </div>
            <div class="v5-mine">
              <label class="v5-f">
                <span>Tu publicación</span>
                <select id="mine"></select>
              </label>
              <label class="v5-f">
                <span>Precio</span>
                <div class="v5-money"><b>$</b><input id="price" inputmode="numeric"></div>
              </label>
              <label class="v5-check"><input type="checkbox" id="free"> Envío gratis</label>
            </div>
            <p class="v5-hint">Es una prueba: no se publica ni cambia nada en Mercado Libre.</p>
            <p class="v5-verdict" id="verdict"></p>
            <ol class="v5-rank" id="rank"></ol>
          </section>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/icons.js?v=14"></script>
<script src="js/v5.js?v=3"></script>
</body>
</html>
